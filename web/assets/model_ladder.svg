<text x="313.75" y="131.26" fill="#f0f0f8" font-size="15" font-weight="700" font-family="JetBrains Mono,monospace">12.5%</text>
<text x="388.75" y="131.26" fill="#606080" font-size="11">1 in 8</text>
<text x="216" y="182.26000000000002" fill="#d0d0e0" font-size="13" text-anchor="end">Gutenberg basis only</text>
<rect x="230" y="161.36" width="344.2" height="33.800000000000004" fill="#f59e0b" opacity="0.85" rx="3"/>
<text x="584.1666666666667" y="183.26000000000002" fill="#f0f0f8" font-size="15" font-weight="700" font-family="JetBrains Mono,monospace">58.3%</text>
<text x="659.1666666666667" y="183.26000000000002" fill="#606080" font-size="11">78-D readout</text>
<text x="216" y="234.26000000000002" fill="#d0d0e0" font-size="13" text-anchor="end">LLM basis only</text>
<rect x="230" y="213.36" width="411.8" height="33.800000000000004" fill="#a78bfa" opacity="0.85" rx="3"/>
<text x="651.7708333333333" y="235.26000000000002" fill="#f0f0f8" font-size="15" font-weight="700" font-family="JetBrains Mono,monospace">69.8%</text>
<text x="726.7708333333333" y="235.26000000000002" fill="#606080" font-size="11">78-D readout</text>
<text x="216" y="286.26" fill="#d0d0e0" font-size="13" text-anchor="end">Spectrometer (both)</text>
<rect x="230" y="265.36" width="448.6" height="33.800000000000004" fill="#34d399" opacity="0.85" rx="3"/>
