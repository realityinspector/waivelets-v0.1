<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="Inter,system-ui,sans-serif">
<rect width="920" height="460" fill="#06060c"/>
<text x="460.0" y="40" fill="#f0f0f8" font-size="20" font-weight="700" text-anchor="middle">Can we tell the models apart?</text>
<text x="460.0" y="62" fill="#9090b0" font-size="12" text-anchor="middle">8-way model-identification accuracy (leave-one-out LDA) · 12 generations per model · 96 total</text>
<text x="460.0" y="80" fill="#34d399" font-size="14" font-weight="600" text-anchor="middle">Yes — the spectrometer gets 76% right. ~6× better than random.</text>
<text x="216" y="130.26" fill="#d0d0e0" font-size="13" text-anchor="end">Random guess</text>
