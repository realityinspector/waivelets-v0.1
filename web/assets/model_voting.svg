<text x="690.8" y="358.27000000000004" fill="#f0f0f8" font-size="15" font-weight="700" font-family="JetBrains Mono,monospace">76.0%</text>
<text x="760.8" y="358.27000000000004" fill="#606080" font-size="11">current 156-D · ←</text>
<line x1="240" y1="388" x2="240" y2="396" stroke="#606080"/>
