<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="Inter,system-ui,sans-serif">
<rect width="920" height="480" fill="#06060c"/>
<text x="460.0" y="40" fill="#f0f0f8" font-size="20" font-weight="700" text-anchor="middle">Does per-sentence + voting help?</text>
<text x="460.0" y="64" fill="#9090b0" font-size="12" text-anchor="middle">Each sentence gets classified independently; the document's prediction = majority vote across its sentences.</text>
<text x="460.0" y="86" fill="#f87171" font-size="13" font-weight="600" text-anchor="middle">No — voting trails the doc-level spectrometer by ~23 pp.</text>
<text x="226" y="141.27" fill="#d0d0e0" font-size="13" text-anchor="end">Random guess</text>
<rect x="240" y="119.72" width="72.5" height="35.1" fill="#606080" opacity="0.85" rx="3"/>
<text x="322.5" y="142.27" fill="#f0f0f8" font-size="15" font-weight="700" font-family="JetBrains Mono,monospace">12.5%</text>
<text x="392.5" y="142.27" fill="#606080" font-size="11">1 in 8</text>
<text x="226" y="195.27" fill="#d0d0e0" font-size="13" text-anchor="end">Per-sentence (single sent)</text>
<rect x="240" y="173.72" width="228.5" height="35.1" fill="#f59e0b" opacity="0.85" rx="3"/>
<text x="478.50194552529183" y="196.27" fill="#f0f0f8" font-size="15" font-weight="700" font-family="JetBrains Mono,monospace">39.4%</text>
<text x="548.5019455252918" y="196.27" fill="#606080" font-size="11">n=3084 sentences</text>
<text x="226" y="249.27" fill="#d0d0e0" font-size="13" text-anchor="end">Confidence-weighted vote</text>
<rect x="240" y="227.72" width="296.0" height="35.1" fill="#a78bfa" opacity="0.85" rx="3"/>
<text x="546.0416666666666" y="250.27" fill="#f0f0f8" font-size="15" font-weight="700" font-family="JetBrains Mono,monospace">51.0%</text>
<text x="616.0416666666666" y="250.27" fill="#606080" font-size="11">mean LDA probability</text>
<text x="226" y="303.27000000000004" fill="#d0d0e0" font-size="13" text-anchor="end">Majority vote</text>
<rect x="240" y="281.72" width="308.1" height="35.1" fill="#22d3ee" opacity="0.85" rx="3"/>
<text x="558.125" y="304.27000000000004" fill="#f0f0f8" font-size="15" font-weight="700" font-family="JetBrains Mono,monospace">53.1%</text>
<text x="628.125" y="304.27000000000004" fill="#606080" font-size="11">argmax of vote counts</text>
<text x="226" y="357.27000000000004" fill="#d0d0e0" font-size="13" text-anchor="end">Doc-level spectrometer</text>
