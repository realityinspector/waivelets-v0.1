<line x1="675.0" y1="388" x2="675.0" y2="396" stroke="#606080"/>
<text x="675.0" y="410" fill="#606080" font-size="10" text-anchor="middle">75%</text>
<line x1="820.0" y1="388" x2="820.0" y2="396" stroke="#606080"/>
<text x="820.0" y="410" fill="#606080" font-size="10" text-anchor="middle">100%</text>
<line x1="312.5" y1="108" x2="312.5" y2="382" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
<text x="530.0" y="455" fill="#9090b0" font-size="11" text-anchor="middle">8-way model-ID accuracy (leave-one-DOCUMENT-out)</text>
