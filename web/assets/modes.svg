<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Inter,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06060c"/>
      <stop offset="1" stop-color="#10101e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg2)"/>

  <text x="600" y="46" fill="#f0f0f8" font-size="24" font-weight="700" text-anchor="middle">The four dynamical modes of text</text>
  <text x="600" y="74" fill="#9090b0" font-size="13" text-anchor="middle">Not genre. Not topic. Not author. <tspan fill="#a5b4fc">How meaning moves through the sentences.</tspan></text>

  <!-- CONVERGENT -->
  <g transform="translate(80,120)">
    <rect width="500" height="260" rx="14" fill="#16162a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="24" y="38" fill="#f59e0b" font-size="14" font-weight="700" letter-spacing="2">CONVERGENT</text>
    <text x="24" y="62" fill="#d0d0e0" font-size="13">Narrows to a few attractors and holds.</text>

    <!-- trajectory: bouncing inside a tight cluster -->
    <g transform="translate(40,90)">
      <rect width="420" height="100" fill="#0a0a14" rx="6"/>
      <circle cx="120" cy="50" r="32" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-dasharray="2 3"/>
      <circle cx="120" cy="50" r="8" fill="#f59e0b" opacity="0.6"/>
      <circle cx="135" cy="42" r="8" fill="#f59e0b" opacity="0.6"/>
      <circle cx="108" cy="56" r="8" fill="#f59e0b" opacity="0.6"/>
      <circle cx="128" cy="58" r="8" fill="#f59e0b" opacity="0.6"/>
      <circle cx="115" cy="44" r="8" fill="#f59e0b" opacity="0.6"/>
      <path d="M 120 50 L 135 42 L 108 56 L 128 58 L 115 44 L 120 50" stroke="#f0f0f8" stroke-width="1" fill="none" opacity="0.5"/>
      <text x="220" y="42" fill="#9090b0" font-size="11">smoothness HIGH +0.40</text>
      <text x="220" y="60" fill="#9090b0" font-size="11">entropy    LOW  3.6</text>
      <text x="220" y="78" fill="#9090b0" font-size="11">oscillation   steady</text>
    </g>

    <text x="24" y="216" fill="#606080" font-size="11" letter-spacing="1">EXAMPLES</text>
    <text x="24" y="236" fill="#d0d0e0" font-size="12">The Bible · graph database textbook · liturgy</text>
    <text x="24" y="252" fill="#d0d0e0" font-size="12">legal code · aphorisms · meditation manuals</text>
  </g>

  <!-- CONTEMPLATIVE -->
  <g transform="translate(620,120)">
    <rect width="500" height="260" rx="14" fill="#16162a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="24" y="38" fill="#a78bfa" font-size="14" font-weight="700" letter-spacing="2">CONTEMPLATIVE</text>
    <text x="24" y="62" fill="#d0d0e0" font-size="13">Thinks about thinking. Interior, recursive.</text>

    <g transform="translate(40,90)">
      <rect width="420" height="100" fill="#0a0a14" rx="6"/>
      <!-- inward spiral -->
      <path d="M 60 50 Q 80 20 130 25 Q 180 30 165 70 Q 150 95 110 90 Q 75 85 95 60 Q 115 40 140 50 Q 155 60 130 70" stroke="#a78bfa" stroke-width="1.6" fill="none" opacity="0.8"/>
      <circle cx="60" cy="50" r="3" fill="#a78bfa"/>
      <circle cx="130" cy="70" r="3" fill="#a78bfa"/>
      <text x="220" y="42" fill="#9090b0" font-size="11">smoothness sustained +0.34</text>
      <text x="220" y="60" fill="#9090b0" font-size="11">entropy    wide       4.3</text>
      <text x="220" y="78" fill="#9090b0" font-size="11">interiority HIGH</text>
    </g>

    <text x="24" y="216" fill="#606080" font-size="11" letter-spacing="1">EXAMPLES</text>
    <text x="24" y="236" fill="#d0d0e0" font-size="12">Augustine · Marcus Aurelius · Woolf's essays</text>
    <text x="24" y="252" fill="#d0d0e0" font-size="12">Borges · Proust · phenomenology</text>
  </g>

  <!-- DISCURSIVE -->
  <g transform="translate(80,400)">
    <rect width="500" height="260" rx="14" fill="#16162a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="24" y="38" fill="#22d3ee" font-size="14" font-weight="700" letter-spacing="2">DISCURSIVE</text>
    <text x="24" y="62" fill="#d0d0e0" font-size="13">The wide river. Sustained shaped discourse.</text>

    <g transform="translate(40,90)">
      <rect width="420" height="100" fill="#0a0a14" rx="6"/>
      <!-- flowing path -->
      <path d="M 20 60 Q 60 40 100 55 T 180 50 T 260 45 T 340 60 T 400 50" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.85"/>
      <circle cx="20" cy="60" r="3" fill="#22d3ee"/>
      <circle cx="100" cy="55" r="2.5" fill="#22d3ee" opacity="0.7"/>
      <circle cx="180" cy="50" r="2.5" fill="#22d3ee" opacity="0.7"/>
      <circle cx="260" cy="45" r="2.5" fill="#22d3ee" opacity="0.7"/>
      <circle cx="340" cy="60" r="2.5" fill="#22d3ee" opacity="0.7"/>
      <circle cx="400" cy="50" r="3" fill="#22d3ee"/>
      <text x="200" y="20" fill="#9090b0" font-size="11">smoothness flowing +0.26</text>
      <text x="200" y="92" fill="#9090b0" font-size="11">entropy wide 4.4 · oscillation moderate</text>
    </g>

    <text x="24" y="216" fill="#606080" font-size="11" letter-spacing="1">EXAMPLES</text>
    <text x="24" y="236" fill="#d0d0e0" font-size="12">Plato · Austen · Tolstoy · Homer</text>
    <text x="24" y="252" fill="#d0d0e0" font-size="12">long-form journalism · epic poetry</text>
  </g>

  <!-- DIALECTICAL -->
  <g transform="translate(620,400)">
    <rect width="500" height="260" rx="14" fill="#16162a" stroke="#f87171" stroke-width="1.5"/>
    <text x="24" y="38" fill="#f87171" font-size="14" font-weight="700" letter-spacing="2">DIALECTICAL</text>
    <text x="24" y="62" fill="#d0d0e0" font-size="13">Oscillates between registers. Mode-switching.</text>

    <g transform="translate(40,90)">
      <rect width="420" height="100" fill="#0a0a14" rx="6"/>
      <!-- zigzag -->
      <path d="M 20 80 L 50 25 L 80 75 L 110 30 L 140 80 L 170 25 L 200 75 L 230 30 L 260 80 L 290 25 L 320 75 L 350 30 L 380 80 L 400 50" stroke="#f87171" stroke-width="2" fill="none" opacity="0.85"/>
      <text x="220" y="14" fill="#9090b0" font-size="11">oscillation HIGH 0.255</text>
      <text x="220" y="98" fill="#9090b0" font-size="11">entropy wide · smoothness flowing</text>
    </g>

    <text x="24" y="216" fill="#606080" font-size="11" letter-spacing="1">EXAMPLES</text>
    <text x="24" y="236" fill="#d0d0e0" font-size="12">Shakespeare · Darwin · Dostoyevsky</text>
    <text x="24" y="252" fill="#d0d0e0" font-size="12">scientific argument · drama · debate</text>
  </g>

  <text x="600" y="700" fill="#606080" font-size="11" text-anchor="middle">From 100 Gutenberg texts (Homer → Kafka, 7 genres). Modes emerge from hierarchical clustering of 7-number fingerprints — not from labels.</text>
</svg>
