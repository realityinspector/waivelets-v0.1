<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Inter,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06060c"/>
      <stop offset="1" stop-color="#10101e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg3)"/>

  <text x="600" y="46" fill="#f0f0f8" font-size="24" font-weight="700" text-anchor="middle">Texts that share a mode</text>
  <text x="600" y="74" fill="#9090b0" font-size="13" text-anchor="middle">Genre is what a text is <tspan fill="#9090b0" font-style="italic">about</tspan>. Mode is what it <tspan fill="#a5b4fc" font-weight="600">does</tspan>. They're orthogonal.</text>

  <!-- Pairing 1: Bible + Database -->
  <g transform="translate(100,140)">
    <text x="0" y="0" fill="#f59e0b" font-size="11" font-weight="700" letter-spacing="2">CONVERGENT</text>
    <line x1="0" y1="14" x2="1000" y2="14" stroke="#f59e0b" stroke-width="0.5" opacity="0.3"/>

    <g transform="translate(80,80)">
      <circle r="48" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
      <text y="-4" fill="#f0f0f8" font-size="13" font-weight="700" text-anchor="middle">The Bible</text>
      <text y="14" fill="#9090b0" font-size="10" text-anchor="middle">King James</text>
    </g>

    <text x="240" y="84" fill="#f59e0b" font-size="22" font-weight="300">≈</text>

    <g transform="translate(400,80)">
      <circle r="48" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
      <text y="-12" fill="#f0f0f8" font-size="13" font-weight="700" text-anchor="middle">Graph DB</text>
      <text y="6" fill="#f0f0f8" font-size="13" font-weight="700" text-anchor="middle">Textbook</text>
      <text y="22" fill="#9090b0" font-size="10" text-anchor="middle">technical</text>
    </g>

    <text x="540" y="80" fill="#d0d0e0" font-size="12">Both narrow to a small set of attractors</text>
    <text x="540" y="98" fill="#9090b0" font-size="11">and hold there. Liturgical repetition.</text>
    <text x="540" y="116" fill="#9090b0" font-size="11">Definitional precision. Same dynamics.</text>
  </g>

  <!-- Pairing 2: Shakespeare + Darwin -->
  <g transform="translate(100,290)">
    <text x="0" y="0" fill="#f87171" font-size="11" font-weight="700" letter-spacing="2">DIALECTICAL</text>
    <line x1="0" y1="14" x2="1000" y2="14" stroke="#f87171" stroke-width="0.5" opacity="0.3"/>

    <g transform="translate(80,80)">
      <circle r="48" fill="#f87171" opacity="0.12" stroke="#f87171" stroke-width="1.5"/>
      <text y="-4" fill="#f0f0f8" font-size="13" font-weight="700" text-anchor="middle">Shakespeare</text>
      <text y="14" fill="#9090b0" font-size="10" text-anchor="middle">Hamlet, Lear</text>
    </g>

    <text x="240" y="84" fill="#f87171" font-size="22" font-weight="300">≈</text>

    <g transform="translate(400,80)">
      <circle r="48" fill="#f87171" opacity="0.12" stroke="#f87171" stroke-width="1.5"/>
      <text y="-4" fill="#f0f0f8" font-size="13" font-weight="700" text-anchor="middle">Darwin</text>
      <text y="14" fill="#9090b0" font-size="10" text-anchor="middle">Origin of Species</text>
    </g>

    <text x="540" y="80" fill="#d0d0e0" font-size="12">Both oscillate between registers.</text>
    <text x="540" y="98" fill="#9090b0" font-size="11">Soliloquy ↔ dialogue, claim ↔ counter-claim.</text>
    <text x="540" y="116" fill="#9090b0" font-size="11">Dramatic mode-switching, sustained tension.</text>
  </g>

  <!-- Pairing 3: Plato + Austen -->
  <g transform="translate(100,440)">
    <text x="0" y="0" fill="#22d3ee" font-size="11" font-weight="700" letter-spacing="2">DISCURSIVE</text>
    <line x1="0" y1="14" x2="1000" y2="14" stroke="#22d3ee" stroke-width="0.5" opacity="0.3"/>

    <g transform="translate(80,80)">
      <circle r="48" fill="#22d3ee" opacity="0.12" stroke="#22d3ee" stroke-width="1.5"/>
      <text y="-4" fill="#f0f0f8" font-size="13" font-weight="700" text-anchor="middle">Plato</text>
      <text y="14" fill="#9090b0" font-size="10" text-anchor="middle">Republic</text>
    </g>

    <text x="240" y="84" fill="#22d3ee" font-size="22" font-weight="300">≈</text>

    <g transform="translate(400,80)">
      <circle r="48" fill="#22d3ee" opacity="0.12" stroke="#22d3ee" stroke-width="1.5"/>
      <text y="-4" fill="#f0f0f8" font-size="13" font-weight="700" text-anchor="middle">Austen</text>
      <text y="14" fill="#9090b0" font-size="10" text-anchor="middle">Pride &amp; Prejudice</text>
    </g>

    <text x="540" y="80" fill="#d0d0e0" font-size="12">Both flow as wide-river discourse.</text>
    <text x="540" y="98" fill="#9090b0" font-size="11">Sustained, shaped, conversational unfolding.</text>
    <text x="540" y="116" fill="#9090b0" font-size="11">Argument and social comedy share a current.</text>
  </g>

  <text x="600" y="630" fill="#606080" font-size="12" text-anchor="middle" font-style="italic">"Are you really telling me Plato and Pride &amp; Prejudice are the same kind of text?"</text>
  <text x="600" y="652" fill="#9090b0" font-size="12" text-anchor="middle">Structurally, yes. They <tspan fill="#22d3ee" font-weight="600">move</tspan> the same way.</text>
</svg>
