<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Inter,system-ui,sans-serif">
<rect width="760" height="280" fill="#06060c"/>
<text x="380.0" y="36" fill="#f0f0f8" font-size="17" font-weight="700" text-anchor="middle">The two bases are nearly orthogonal</text>
<text x="380.0" y="58" fill="#9090b0" font-size="11.5" text-anchor="middle">|cos| between each Gutenberg eigenvector and its best-matched LLM-PCA eigenvector</text>
<circle cx="180" cy="170" r="60" fill="#f59e0b" opacity="0.18" stroke="#f59e0b" stroke-width="2"/>
<text x="180" y="175" fill="#f0f0f8" font-size="13" font-weight="700" text-anchor="middle">Gutenberg</text>
<text x="180" y="192" fill="#9090b0" font-size="11" text-anchor="middle">100 literary texts</text>
<circle cx="580" cy="170" r="60" fill="#a78bfa" opacity="0.18" stroke="#a78bfa" stroke-width="2"/>
<text x="580" y="175" fill="#f0f0f8" font-size="13" font-weight="700" text-anchor="middle">LLM-PCA</text>
<text x="580" y="192" fill="#9090b0" font-size="11" text-anchor="middle">3084 LLM sentences</text>
<line x1="248" y1="170" x2="512" y2="170" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>
<text x="380.0" y="158" fill="#34d399" font-size="13" font-weight="600" text-anchor="middle">mean |cos| = 0.112</text>
<text x="380.0" y="188" fill="#9090b0" font-size="10.5" text-anchor="middle">range 0.038–0.175  ·  basis vectors are essentially perpendicular</text>
</svg>