    <text x="100" y="148" fill="#d0d0e0" font-size="11" text-anchor="middle">26-mode eigenbasis</text>
    <text x="100" y="166" fill="#9090b0" font-size="11" text-anchor="middle">Trajectory through attractors</text>
  </g>

  <line x1="746" y1="230" x2="790" y2="230" stroke="#9090b0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 4: 7 numbers -->
  <g transform="translate(800,140)">
    <rect width="180" height="180" rx="10" fill="#16162a" stroke="#1e1e3a"/>
    <text x="90" y="28" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">FINGERPRINT</text>
    <g font-family="JetBrains Mono, monospace" font-size="10.5" fill="#d0d0e0">
      <text x="16" y="56">smoothness   +0.41</text>
      <text x="16" y="74">oscillation   0.18</text>
      <text x="16" y="92">entropy       3.6 </text>
      <text x="16" y="110">exposition   +0.7</text>
      <text x="16" y="128">interiority  +0.2</text>
      <text x="16" y="146">structure    +0.3</text>
      <text x="16" y="164">narration    -0.1</text>
    </g>
  </g>

  <line x1="986" y1="230" x2="1030" y2="230" stroke="#9090b0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 5: Mode -->
  <g transform="translate(1040,140)">
    <rect width="130" height="180" rx="10" fill="#16162a" stroke="#f59e0b"/>
    <text x="65" y="28" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CLASSIFY</text>
    <circle cx="65" cy="92" r="36" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="65" y="88" fill="#f59e0b" font-size="13" font-weight="700" text-anchor="middle">CONVERGENT</text>
    <text x="65" y="108" fill="#9090b0" font-size="9" text-anchor="middle">distance 0.14</text>
    <text x="65" y="148" fill="#d0d0e0" font-size="11" text-anchor="middle">1 of 4 modes</text>
    <text x="65" y="164" fill="#606080" font-size="9.5" text-anchor="middle">+ AI/human score</text>
  </g>

  <!-- footer -->
  <text x="600" y="430" fill="#606080" font-size="11" text-anchor="middle">From "telescope" (wavelet analysis) to "map" (eigenbasis): the same structure, 1000× faster.</text>
  <text x="600" y="450" fill="#606080" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">waivelets-production.up.railway.app</text>
</svg>
