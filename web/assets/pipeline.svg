      <g>
        <rect x="0" y="0" width="6" height="14" fill="#22d3ee" opacity="0.4"/>
        <rect x="6" y="0" width="6" height="14" fill="#22d3ee" opacity="0.7"/>
        <rect x="12" y="0" width="6" height="14" fill="#22d3ee" opacity="0.3"/>
        <rect x="18" y="0" width="6" height="14" fill="#22d3ee" opacity="0.9"/>
        <rect x="24" y="0" width="6" height="14" fill="#22d3ee" opacity="0.2"/>
        <rect x="30" y="0" width="6" height="14" fill="#22d3ee" opacity="0.5"/>
        <rect x="36" y="0" width="6" height="14" fill="#22d3ee" opacity="0.8"/>
        <rect x="42" y="0" width="6" height="14" fill="#22d3ee" opacity="0.6"/>
        <rect x="48" y="0" width="6" height="14" fill="#22d3ee" opacity="0.35"/>
        <rect x="54" y="0" width="6" height="14" fill="#22d3ee" opacity="0.75"/>
