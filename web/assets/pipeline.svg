      <circle cx="-50" cy="-20" r="14" fill="#a78bfa" opacity="0.6"/>
      <circle cx="-20" cy="-30" r="9" fill="#a78bfa" opacity="0.4"/>
      <circle cx="15" cy="-25" r="11" fill="#a78bfa" opacity="0.5"/>
      <circle cx="45" cy="-15" r="8" fill="#a78bfa" opacity="0.35"/>
      <circle cx="-40" cy="10" r="10" fill="#a78bfa" opacity="0.45"/>
      <circle cx="-10" cy="5" r="16" fill="#a78bfa" opacity="0.7"/>
      <circle cx="25" cy="15" r="9" fill="#a78bfa" opacity="0.4"/>
      <circle cx="50" cy="0" r="7" fill="#a78bfa" opacity="0.3"/>
      <circle cx="-25" cy="25" r="8" fill="#a78bfa" opacity="0.35"/>
      <circle cx="10" cy="30" r="11" fill="#a78bfa" opacity="0.5"/>
