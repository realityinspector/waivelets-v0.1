  <rect width="1200" height="480" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="42" fill="#f0f0f8" font-size="22" font-weight="700" text-anchor="middle">Waivelets pipeline — text → 7 numbers in &lt;1ms</text>
  <text x="600" y="68" fill="#9090b0" font-size="13" text-anchor="middle">MiniLM embeddings · 26-mode attractor eigenbasis · 4 dynamical modes</text>

  <!-- Stage 1: Text -->
  <g transform="translate(40,140)">
    <rect width="180" height="180" rx="10" fill="#16162a" stroke="#1e1e3a"/>
    <text x="90" y="28" fill="#6366f1" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">INPUT</text>
    <text x="14" y="58" fill="#d0d0e0" font-size="11" font-family="JetBrains Mono, monospace">"In the beginning</text>
    <text x="14" y="78" fill="#d0d0e0" font-size="11" font-family="JetBrains Mono, monospace">God created..."</text>
    <text x="14" y="108" fill="#606080" font-size="10">— any prose,</text>
    <text x="14" y="124" fill="#606080" font-size="10">poetry, code,</text>
    <text x="14" y="140" fill="#606080" font-size="10">essay, dialogue</text>
    <text x="90" y="166" fill="#9090b0" font-size="11" text-anchor="middle">Raw text</text>
  </g>

  <!-- Arrow 1 -->
