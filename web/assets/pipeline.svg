        <rect x="120" y="0" width="6" height="14" fill="#22d3ee" opacity="0.3"/>
        <rect x="126" y="0" width="6" height="14" fill="#22d3ee" opacity="0.5"/>
        <rect x="132" y="0" width="6" height="14" fill="#22d3ee" opacity="0.8"/>
        <rect x="138" y="0" width="6" height="14" fill="#22d3ee" opacity="0.4"/>
        <rect x="144" y="0" width="6" height="14" fill="#22d3ee" opacity="0.7"/>
        <rect x="150" y="0" width="6" height="14" fill="#22d3ee" opacity="0.55"/>
        <rect x="156" y="0" width="6" height="14" fill="#22d3ee" opacity="0.9"/>
